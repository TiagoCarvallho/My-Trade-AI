<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#0d1117"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#1e2330" stroke-width="8"/>
  <!-- Candlestick Chart Icon -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Candle 1 -->
    <line x1="120" y1="280" x2="120" y2="400" stroke="#ef4444" stroke-width="6"/>
    <rect x="100" y="310" width="40" height="60" fill="#ef4444" rx="6"/>
    <!-- Candle 2 -->
    <line x1="200" y1="200" x2="200" y2="360" stroke="#10b981" stroke-width="6"/>
    <rect x="180" y="230" width="40" height="90" fill="#10b981" rx="6"/>
    <!-- Candle 3 -->
    <line x1="280" y1="160" x2="280" y2="300" stroke="#10b981" stroke-width="6"/>
    <rect x="260" y="180" width="40" height="80" fill="#10b981" rx="6"/>
    <!-- Candle 4 -->
    <line x1="360" y1="100" x2="360" y2="260" stroke="#06b6d4" stroke-width="6"/>
    <rect x="340" y="120" width="40" height="110" fill="#06b6d4" rx="6"/>
    <!-- Trendline arrow -->
    <path d="M 90 350 L 190 250 L 270 200 L 390 110" stroke="#22d3ee" stroke-width="12"/>
    <polygon points="410,95 375,105 395,125" fill="#22d3ee"/>
  </g>
  <!-- Text Badge -->
  <text x="256" y="450" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="#22d3ee" text-anchor="middle" letter-spacing="2">MY TRADE AI</text>
</svg>
