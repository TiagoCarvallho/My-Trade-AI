<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#0d1117"/>
  <!-- App Header -->
  <rect x="0" y="0" width="1080" height="160" fill="#131722"/>
  <text x="60" y="100" font-family="system-ui, sans-serif" font-weight="800" font-size="48" fill="#06b6d4">MY TRADE AI PRO</text>
  <!-- Main Card -->
  <rect x="40" y="200" width="1000" height="800" rx="32" fill="#131722" stroke="#1e2330" stroke-width="4"/>
  <text x="80" y="280" font-family="system-ui, sans-serif" font-weight="700" font-size="36" fill="#f8fafc">Análise de Gráfico Quantitativo &amp; SMC</text>
  <path d="M 100 700 L 300 500 L 500 600 L 700 350 L 900 250" stroke="#10b981" stroke-width="12" fill="none"/>
  <!-- Status Badge -->
