  <rect x="40" y="1040" width="1000" height="600" rx="32" fill="#131722" stroke="#1e2330" stroke-width="4"/>
  <text x="80" y="1120" font-family="system-ui, sans-serif" font-weight="700" font-size="32" fill="#38bdf8">Níveis Chave de Liquidez</text>
  <text x="80" y="1200" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">Stop Loss: 1.08200 | Take Profit: 1.09450</text>
  <text x="80" y="1260" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">Relação Risco:Retorno: 1:3.2</text>
</svg>
